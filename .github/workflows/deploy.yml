name: Build and Commit index.html

on:
  push:
    branches:
      - main
    paths:
      - 'pages/**'
      - 'template.html'
      - 'scripts/build.py'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動書き込み権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # mainブランチを明示的に指定（detached HEAD回避）

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install markdown

      - name: Run build script
        run: python scripts/build.py

      - name: Commit and push generated index.html
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: Update index.html from markdown [skip ci]"
          file_pattern: "index.html"