  }

  function showPage() {
    var hash = location.hash || '#home';
    var key = hash.replace('#', '');

    if (key.indexOf('acc-') === 0) {
      key = 'accessories';
    }

    if (!pages[key]) {
      key = 'home';
    }

    Object.keys(pages).forEach(function (pageKey) {
      if (pages[pageKey]) {
        pages[pageKey].hidden = pageKey !== key;
      }
    });

    updateActiveMenu(key === 'accessories' ? '#accessories' : hash);

    if (location.hash && location.hash.indexOf('#acc-') === 0) {
      var targetEl = document.querySelector(location.hash);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: 'smooth' });
      }
    }
  }

  window.addEventListener('hashchange', showPage);
  showPage();

  var filterBtns = document.querySelectorAll('.filter-btn');
  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterBtns.forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      var filter = btn.getAttribute('data-filter');
      var cards = document.querySelectorAll('.accessory-item-card');
      cards.forEach(function (card) {
        if (filter === 'all' || card.getAttribute('data-category') === filter) {
          card.classList.remove('is-hidden');
        } else {
          card.classList.add('is-hidden');
        }
      });
    });
  });
})();
</script>
</body>
</html>
